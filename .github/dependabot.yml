# Keeps our pinned versions fresh. GitHub Actions are pinned to full commit
# SHAs (house rule, see the workflows); Dependabot reads the trailing "# vX.Y.Z"
# comment and opens a PR that bumps the SHA plus the comment together. The
# "npm" ecosystem reads pnpm-lock.yaml and covers the devDependencies; when
# apps/web and apps/cms land, add their directories here and group the
# Astro/Payload dependency surface so update PRs stay reviewable.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait before opening version-update PRs so freshly published malware or
    # broken releases have time to surface. Security updates still open
    # immediately, but pnpm's 3-day release quarantine (pnpm-workspace.yaml,
    # minimumReleaseAge) can block regenerating the lockfile for a fix younger
    # than 3 days; lower that value temporarily if a fix cannot wait.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
