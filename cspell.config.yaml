# Spell check for the repo: prose and docs are part of the product, so typos
# are defects. Runs as `pnpm run check:spell` (part of `pnpm run check`).
# Unknown real words go into the project dictionary below, sorted.
version: "0.2"
language: en
files:
  - "**/*.md"
  - "**/*.{json,jsonc,yml,yaml,toml}"
  - "**/*.{ts,tsx,astro,css}"
  - "scripts/**"
  - ".githooks/**"
  - ".github/CODEOWNERS"
ignorePaths:
  # Dependency and lock churn.
  - node_modules
  - pnpm-lock.yaml
  # Build output.
  - dist
  - .astro
  - .next
  - .vercel
  - .wrangler
  # Legal text stays byte-for-byte as drafted (see .prettierignore); flagging
  # words we are not allowed to fix is pure noise.
  - LICENSE.md
  - LEGAL.md
  # Content-shaped fixture data (job titles, German legal HTML, etc.).
  - apps/web/test/fixtures/ci-content/**
  # Visual-regression fixtures: deliberate fake company names and German
  # variant copy, same content-shaped rationale as the CI content fixture.
  - "apps/web/src/components/**/*.vrt.ts"
  # Tiny Python zip helper for the Playwright container.
  - scripts/check/vrt-unzip.py
  # Symlink into .agents (checked via its real path).
  - .claude/skills
  # VS Code extension IDs are vendor handles, not project vocabulary.
  - .vscode/extensions.json
  # Generated partner logo manifest: mirror filenames and company-name
  # slugs, not prose (regenerated from the site extraction, never edited).
  - apps/web/src/components/partner/logo-manifest.json
  # Generated code: regenerated by their tools, never hand-edited, and full
  # of vendor API vocabulary (Cloudflare runtime types, Payload schema types,
  # the admin import map). Not project prose.
  - apps/web/worker-configuration.d.ts
  - apps/cms/src/payload-types.ts
  - apps/cms/next-env.d.ts
  - apps/cms/src/app/(payload)/importMap.js
  - apps/cms/src/migrations/**
useGitignore: true
