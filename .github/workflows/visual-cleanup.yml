name: Visual review cleanup

# When a PR closes (merged or not), sweep its throwaway Cloudflare Pages
# visual-report deployment(s) so hosting never accumulates. The script deletes
# every closed PR's report (not just this one), so an orphan left by a missed
# `closed` event is reclaimed on the next close. Isolated from visual.yml so a
# `closed` event runs only this. For a `closed` event GitHub uses the workflow
# file from the base branch (main), so it takes effect once merged.
on:
  pull_request:
    types: [closed]
    # Only PRs targeting main, so this trusted (main) workflow definition runs.
    branches: [main]

permissions:
  contents: read
  pull-requests: read # the sweep reads each pr-<N>'s state to know which are stale

jobs:
  cleanup:
    # Same-repo only: fork PRs never got the CF secrets, so they published nothing.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Check out the repo's DEFAULT branch, not the PR head and not the PR's
      # base ref. A PR's base can be any collaborator-controlled branch, so
      # running its `vrt-cleanup.mjs` here would execute untrusted code with the
      # Cloudflare token; the default branch is the trusted source for this
      # infra script.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: sweep closed PRs' report deployments
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT: q-web-vrt-reports
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/check/vrt-cleanup.mjs
