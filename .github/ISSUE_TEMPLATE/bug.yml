name: "🐛 Bug report"
description: "Something on the website or in the CMS doesn't work as documented or expected."
title: "[Bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Website page or content
        - CMS admin (Payload)
        - Build or deploy
        - Analytics
        - Docs / repo
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      placeholder: |
        1. Open ...
        2. Click ...
        3. See error
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Browser, device, and page URL if known"
    validations:
      required: false
